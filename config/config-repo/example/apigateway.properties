server.port=4002

# Gateway config for development ----------------------------------------------
spring.cloud.loadbalancer.cache.enabled=false
eureka.client.registry-fetch-interval-seconds=5

# Routes common config --------------------------------------------------------
spring.cloud.gateway.server.webmvc.default-filters[0]=RemoveRequestHeader=X-Internal-Request
spring.cloud.gateway.server.webmvc.default-filters[1]=RemoveRequestHeader=X-Account-Id
spring.cloud.gateway.server.webmvc.default-filters[2]=RemoveRequestHeader=X-Account-Role
spring.cloud.gateway.server.webmvc.default-filters[3]=AddRequestHeader=X-Internal-Request, false

# Routes ----------------------------------------------------------------------
spring.cloud.gateway.server.webmvc.routes[0].id=auth
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**, /api/account/**

spring.cloud.gateway.server.webmvc.routes[1].id=storage
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://storage
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/storage/**

# Swagger routes --------------------------------------------------------------
spring.cloud.gateway.server.webmvc.routes[2].id=auth-docs
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://auth
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/v3/api-docs/auth
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=SetPath=/v3/api-docs

springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/auth


spring.cloud.gateway.server.webmvc.routes[3].id=storage-docs
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://storage
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/v3/api-docs/storage
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=SetPath=/v3/api-docs

springdoc.swagger-ui.urls[1].name=Storage Service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/storage

# Security --------------------------------------------------------------------
security.jwt.publicKey=

security.exclude.routes[0]=/api/auth/register
security.exclude.routes[1]=/api/auth/verify
security.exclude.routes[2]=/api/auth/login
security.exclude.routes[3]=/api/auth/refresh
security.exclude.routes[4]=/api/auth/forgot-password
security.exclude.routes[5]=/api/auth/reset-password
security.exclude.routes[6]=/swagger-ui/**
security.exclude.routes[7]=/v3/api-docs/**
security.exclude.routes[8]=/swagger-ui.html

# Swagger config --------------------------------------------------------------
springdoc.swagger-ui.persist-authorization=true
