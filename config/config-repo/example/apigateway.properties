server.port=4002

# Gateway config for development
spring.cloud.loadbalancer.cache.enabled=false
eureka.client.registry-fetch-interval-seconds=10

# Routes common config
spring.cloud.gateway.server.webmvc.default-filters[0]=RemoveRequestHeader=X-Internal-Request
spring.cloud.gateway.server.webmvc.default-filters[1]=RemoveRequestHeader=X-Account-Id
spring.cloud.gateway.server.webmvc.default-filters[2]=RemoveRequestHeader=X-Account-Role
spring.cloud.gateway.server.webmvc.default-filters[3]=AddRequestHeader=X-Internal-Request, false

# Routes
spring.cloud.gateway.server.webmvc.routes[0].id=auth
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**, /api/account/**

# Security
security.jwt.publicKey=

security.exclude.routes[0]=/api/auth/register
security.exclude.routes[1]=/api/auth/verify
security.exclude.routes[2]=/api/auth/login
security.exclude.routes[3]=/api/auth/refresh
security.exclude.routes[4]=/api/auth/forgot-password
security.exclude.routes[5]=/api/auth/reset-password