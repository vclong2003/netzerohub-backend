# Global configs -------------------------------------------------------------

# Database common configs
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Service discovery (Eureka) 
eureka.client.service-url.defaultZone=http://localhost:4001/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.log-delta-diff=false
logging.level.com.netflix.discovery=WARN
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery.shared.resolver.aws=WARN

# OpenAPI common configs (custom)
# redirect to the gateway for all services
openapi.defaultServerUrl=http://localhost:4002

# Logging common configs
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG