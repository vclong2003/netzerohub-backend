services:
  config:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_ID: config
        MODULE_LOCATION: config
    container_name: NetZeroHub-Config
    volumes:
      - ./config/config-repo:/app/config-repo
    network_mode: host
    restart: unless-stopped

  discovery:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_ID: discovery
        MODULE_LOCATION: discovery
    container_name: NetZeroHub-Discovery
    network_mode: host
    restart: unless-stopped
    depends_on:
      - config

  apigateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_ID: apigateway
        MODULE_LOCATION: apigateway
    container_name: NetZeroHub-Gateway
    network_mode: host
    restart: unless-stopped
    depends_on:
      - config

  auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_ID: auth
        MODULE_LOCATION: auth
    container_name: NetZeroHub-Auth
    network_mode: host
    restart: unless-stopped
    depends_on:
      - config

  storage:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_ID: storage
        MODULE_LOCATION: storage
    container_name: NetZeroHub-Storage
    network_mode: host
    restart: unless-stopped
    depends_on:
      - config

  notification:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_ID: notification
        MODULE_LOCATION: notification
    container_name: NetZeroHub-Notification
    network_mode: host
    restart: unless-stopped
    depends_on:
      - config

  green_charging_station:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_ID: green_charging_station
        MODULE_LOCATION: services/green_charging_station
    container_name: NetZeroHub-GreenChargingStation
    network_mode: host
    restart: unless-stopped
    depends_on:
      - config
  
  recycling_centre:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_ID: recycling_centre
        MODULE_LOCATION: services/recycling_centre
    container_name: NetZeroHub-RecyclingCentre
    network_mode: host
    restart: unless-stopped
    depends_on:
      - config  
