services:
  redis:
    image: redis:7-alpine
    container_name: NetZeroHub-Redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS__PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS__PORT}:6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: NetZeroHub-RabbitMQ
    restart: unless-stopped
    ports:
      - "${RABBITMQ__PORT}:5672" # amqp
      - "${RABBITMQ__UI_PORT}:15672" # ui
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ__DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ__DEFAULT_PASS}
      RABBITMQ_NODENAME: rabbit@netzerohub-rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  auth-db:
    image: mysql/mysql-server:8.0.25
    container_name: NetZeroHub-Auth-DB
    restart: unless-stopped
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: ${AUTH_DB__PASSWORD}
    ports:
      - "${AUTH_DB__PORT}:3306"
    volumes:
      - auth_db_data:/var/lib/mysql

  notification-db:
    image: mysql/mysql-server:8.0.25
    container_name: NetZeroHub-Notification-DB
    restart: unless-stopped
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: ${NOTIFICATION_DB__PASSWORD}
    ports:
      - "${NOTIFICATION_DB__PORT}:3306"
    volumes:
      - notification_db_data:/var/lib/mysql

volumes:
  rabbitmq_data:
  auth_db_data:
  notification_db_data:
