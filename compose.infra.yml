services:
  redis:
    image: redis:7-alpine
    container_name: NetZeroHub-Redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS__PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS__PORT}:6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: NetZeroHub-RabbitMQ
    restart: unless-stopped
    ports:
      - "${RABBITMQ__PORT}:5672" # amqp
      - "${RABBITMQ__UI_PORT}:15672" # ui
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ__DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ__DEFAULT_PASS}
      RABBITMQ_NODENAME: rabbit@netzerohub-rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: NetZeroHub-RustFS
    restart: unless-stopped
    command: /data
    ports:
      - "${RUSTFS__API_PORT}:9000"
      - "${RUSTFS__CONSOLE_PORT}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS__ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS__SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
    volumes:
      - rustfs_data:/data

  auth-db:
    image: mysql/mysql-server:8.0.25
    container_name: NetZeroHub-Auth-DB
    restart: unless-stopped
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: ${AUTH_DB__PASSWORD}
    ports:
      - "${AUTH_DB__PORT}:3306"
    volumes:
      - auth_db_data:/var/lib/mysql

  green-charging-station-db:
    image: mysql/mysql-server:8.0.25
    container_name: NetZeroHub-GreenChargingStation-DB
    restart: unless-stopped
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: ${GREEN_CHARGING_STATION_DB__PASSWORD}
    ports:
      - "${GREEN_CHARGING_STATION_DB__PORT}:3306"
    volumes:
      - green_charging_station_db_data:/var/lib/mysql

  recycling-center-db:
    image: mysql/mysql-server:8.0.25
    container_name: NetZeroHub-RecyclingCenter-DB
    restart: unless-stopped
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: ${RECYCLING_CENTER_DB__PASSWORD}
    ports:
      - "${RECYCLING_CENTER_DB__PORT}:3306"
    volumes:
      - recycling_center_db_data:/var/lib/mysql

  pollution-report-db:
    image: mysql/mysql-server:8.0.25
    container_name: NetZeroHub-PollutionReport-DB
    restart: unless-stopped
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: ${POLLUTION_REPORT_DB__PASSWORD}
    ports:
      - "${POLLUTION_REPORT_DB__PORT}:3306"
    volumes:
      - pollution_report_db_data:/var/lib/mysql

volumes:
  rabbitmq_data:
  rustfs_data:
  auth_db_data:
  green_charging_station_db_data:
  recycling_center_db_data:
  pollution_report_db_data:
