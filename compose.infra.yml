services:
  redis:
    image: redis:7-alpine
    container_name: NetZeroHub-Redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS__PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS__PORT}:6379"

  auth-db:
    image: mysql/mysql-server:8.0.25
    container_name: NetZeroHub-Auth-DB
    restart: unless-stopped
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: ${AUTH_DB__PASSWORD}
    ports:
      - "${AUTH_DB__PORT}:3306"
