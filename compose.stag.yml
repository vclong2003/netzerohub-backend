services:
  config:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_ID: config
        MODULE_LOCATION: config
    container_name: NetZeroHub-Config
    environment:
      - SERVER_PORT=4000
    volumes:
      - /home/vclong2003/Workspace/netzerohub-backend/configs:/app/config-repo
    networks:
      - netzerohub-net
    restart: unless-stopped

  discovery:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_ID: discovery
        MODULE_LOCATION: discovery
    container_name: NetZeroHub-Discovery
    environment:
      - CONFIG_SERVER_URL=http://config:4000
    networks:
      - netzerohub-net
    restart: unless-stopped
    depends_on:
      - config

  apigateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_ID: apigateway
        MODULE_LOCATION: apigateway
    container_name: NetZeroHub-Gateway
    environment:
      - SERVER_PORT=8080
      - CONFIG_SERVER_URL=http://config:4000
    ports:
      - "4000:8080"
    networks:
      - netzerohub-net
    restart: unless-stopped
    depends_on:
      - config

  auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_ID: auth
        MODULE_LOCATION: auth
    container_name: NetZeroHub-Auth
    environment:
      - CONFIG_SERVER_URL=http://config:4000
    networks:
      - netzerohub-net
    restart: unless-stopped
    depends_on:
      - config

  storage:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_ID: storage
        MODULE_LOCATION: storage
    container_name: NetZeroHub-Storage
    environment:
      - CONFIG_SERVER_URL=http://config:4000
    networks:
      - netzerohub-net
    restart: unless-stopped
    depends_on:
      - config

  notification:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_ID: notification
        MODULE_LOCATION: notification
    container_name: NetZeroHub-Notification
    environment:
      - CONFIG_SERVER_URL=http://config:4000
    networks:
      - netzerohub-net
    restart: unless-stopped
    depends_on:
      - config

  green_charging_station:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_ID: green_charging_station
        MODULE_LOCATION: services/green_charging_station
    container_name: NetZeroHub-GreenChargingStation
    environment:
      - CONFIG_SERVER_URL=http://config:4000
    networks:
      - netzerohub-net
    restart: unless-stopped
    depends_on:
      - config
      
  recycling_centre:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_ID: recycling_centre
        MODULE_LOCATION: services/recycling_centre
    container_name: NetZeroHub-RecyclingCentre
    environment:
      - CONFIG_SERVER_URL=http://config:4000
    networks:
      - netzerohub-net
    restart: unless-stopped
    depends_on:
      - config

networks:
  netzerohub-net:
    driver: bridge
