services:
  config:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: config
    container_name: NetZeroHub-Config
    environment:
      - SERVER_PORT=4000
    volumes:
      - /home/vclong2003/Workspace/netzerohub-backend/configs:/app/config-repo
    networks:
      - netzerohub-net
    restart: unless-stopped

  discovery:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: discovery
    container_name: NetZeroHub-Discovery
    environment:
      - CONFIG_SERVER_URL=http://config:4000
    networks:
      - netzerohub-net
    restart: unless-stopped
    depends_on:
      - config

  apigateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: apigateway
    container_name: NetZeroHub-Gateway
    environment:
      - SERVER_PORT=8080
      - CONFIG_SERVER_URL=http://config:4000
    ports:
      - "4000:8080"
    networks:
      - netzerohub-net
    restart: unless-stopped
    depends_on:
      - config

  auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: auth
    container_name: NetZeroHub-Auth
    environment:
      - CONFIG_SERVER_URL=http://config:4000
    networks:
      - netzerohub-net
    restart: unless-stopped
    depends_on:
      - config

  storage:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: storage
    container_name: NetZeroHub-Storage
    environment:
      - CONFIG_SERVER_URL=http://config:4000
    networks:
      - netzerohub-net
    restart: unless-stopped
    depends_on:
      - config

  notification:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: notification
    container_name: NetZeroHub-Notification
    environment:
      - CONFIG_SERVER_URL=http://config:4000
    networks:
      - netzerohub-net
    restart: unless-stopped
    depends_on:
      - config

networks:
  netzerohub-net:
    driver: bridge
